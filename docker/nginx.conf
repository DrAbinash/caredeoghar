# nginx reverse-proxy + static SPA host for Care Diagnostics.
# Serves the two web frontends and forwards /api/* to the api container.

server {
    listen 80 default_server;
    server_name _;

    # Allow file uploads (lab reports, logos, attachments)
    client_max_body_size 25m;

    # Hide nginx version
    server_tokens off;

    # ---- API reverse proxy ------------------------------------------------
    # The "api" name resolves via docker-compose's internal DNS.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Super Admin Portal (built with BASE_PATH=/super-admin-portal/) --
    location /super-admin-portal/ {
        alias /usr/share/nginx/html/super-admin-portal/;
        try_files $uri $uri/ /super-admin-portal/index.html;
    }

    # ---- Main Diagnostic ERP (catch-all SPA) -----------------------------
    location / {
        root /usr/share/nginx/html/erp;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed asset files
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html/erp;
        try_files $uri /super-admin-portal$uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
