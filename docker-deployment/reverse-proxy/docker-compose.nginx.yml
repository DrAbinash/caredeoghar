# =============================================================================
# Care Diagnostics ERP — Optional Nginx Reverse Proxy (DISABLED by default)
# =============================================================================
#
# IMPORTANT: You do NOT need this for local use (localhost:8081).
# Only enable this when you need:
#   • a custom domain name (e.g. erp.hopehospital.in)
#   • HTTPS / SSL certificates
#   • remote access from outside the LAN
#   • PACS / DICOM routing through a single entry point
#   • load balancing in the future
#
# Architecture with Nginx:
#   ┌───────────────────────────────────────────────────────────┐
#   │  Internet / LAN                                           │
#   │      │                                                    │
#   │      ▼                                                    │
#   │  ┌────────────┐                                         │
#   │  │   Nginx     │   (port 80 / 443)                          │
#   │  │  Reverse    │   • domain routing                        │
#   │  │   Proxy     │   • SSL termination                       │
#   │  │             │   • security headers                      │
#   │  └────────────┘                                         │
#   │      │                                                    │
#   │      ▼ ──────────────────────────────────────────────────┒
#   │      │                                                    │
#   │      ▼                                                    │
#   │  ┌───────────────────────────────────────────────────────────┐
#   │  │  PostgreSQL    │   │  Backend (Express + SPAs)       │
#   │  │  Port: 5432     │   │  Port: 8080                     │
#   │  │  Internal only  │   │  API + website + ERP + admin      │
#   │  └──────────────┘   └──────────────────────────────────────────────────────┘
#   └───────────────────────────────────────────────────────────┘
#
# HOW TO ENABLE:
#   1. Replace this file with the main docker-compose.yml OR
#   2. Copy contents into your existing docker-compose.yml OR
#   3. Run: docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# This file is kept separate so beginners don't accidentally enable it.
# =============================================================================

version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: care-diagnostics-nginx
    restart: unless-stopped
    ports:
      # HTTP — redirects to HTTPS when SSL is configured
      - "80:80"
      # HTTPS — uncomment when SSL certificates are ready
      # - "443:443"
    volumes:
      # Nginx configuration file
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates (future — uncomment when you have certs)
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - care-diagnostics
    # Memory limit — nginx is lightweight
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# Reuse the same network as the main compose file
networks:
  care-diagnostics:
    external: true
