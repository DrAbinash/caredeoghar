# =============================================================================
# Care Diagnostics ERP — Nginx Reverse Proxy Configuration (HTTP Only)
# =============================================================================
#
# This is the basic HTTP reverse proxy configuration.
# It routes all traffic to the backend container on port 8080.
#
# To use: place this file in the same folder as docker-compose.nginx.yml
# and start with: docker compose -f docker-compose.nginx.yml up -d
#
# NOTE: For production over the internet, you MUST add SSL (see
# nginx-ssl-template.conf). HTTP alone is NOT secure for patient data.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # MIME types and basic settings
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Upload limits — large enough for DICOM files in the future
    # -------------------------------------------------------------------------
    client_max_body_size 512M;
    client_body_buffer_size 16K;

    # -------------------------------------------------------------------------
    # Timeouts for long-running operations (report generation, backups)
    # -------------------------------------------------------------------------
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # -------------------------------------------------------------------------
    # Proxy buffering — important for large file streaming (future DICOM)
    # -------------------------------------------------------------------------
    proxy_buffering off;
    proxy_request_buffering off;

    # -------------------------------------------------------------------------
    # Security headers (always included, even without SSL)
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -------------------------------------------------------------------------
    # Gzip compression for API responses and static assets
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # UPSTREAM: Backend container (Express server)
    # -------------------------------------------------------------------------
    upstream backend_server {
        server backend:8080;
        # Future: add more backend instances for load balancing
        # server backend2:8080;
        # server backend3:8080;
    }

    # -------------------------------------------------------------------------
    # SERVER BLOCK: Main ERP entry point
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (used by load balancers / monitoring)
        location /nginx-health {
            access_log off;
            return 200 "nginx-ok\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------------
        # Main proxy: everything goes to the backend
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;

            # WebSocket support (for future real-time features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward real client IP to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent request buffering for large uploads (future DICOM)
            proxy_request_buffering off;
        }

        # -----------------------------------------------------------------
        # Future: PACS / DICOM routing (placeholder)
        # Uncomment when you add a PACS server container
        # -----------------------------------------------------------------
        # location /pacs/ {
        #     proxy_pass http://pacs-server:8042/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_read_timeout 600s;
        # }

        # -----------------------------------------------------------------
        # Future: Reports portal (placeholder for standalone reports service)
        # -----------------------------------------------------------------
        # location /reports/ {
        #     proxy_pass http://reports-server:3001/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        # }
    }
}
