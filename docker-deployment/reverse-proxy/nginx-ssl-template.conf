# =============================================================================
# Care Diagnostics ERP — Nginx SSL/HTTPS Template (for custom domains)
# =============================================================================
#
# This is a TEMPLATE. Copy this file to nginx.conf and fill in your
# actual domain and certificate paths when you are ready for HTTPS.
#
# Prerequisites:
#   1. You own a domain name (e.g. erp.hopehospital.in)
#   2. You have SSL certificates (from Let's Encrypt, Cloudflare, etc.)
#   3. Your DNS A-record points to this server's public IP
#
# Certificate paths (mounted as read-only in docker-compose.nginx.yml):
#   - /etc/nginx/certs/fullchain.pem   (certificate + chain)
#   - /etc/nginx/certs/privkey.pem     (private key)
#
# HOW TO GET FREE SSL CERTIFICATES (Let's Encrypt):
#   1. Install certbot on your host (NOT inside Docker)
#   2. Run: certbot certonly --standalone -d erp.hopehospital.in
#   3. Certificates saved to: /etc/letsencrypt/live/erp.hopehospital.in/
#   4. Mount those files into the nginx container
#   5. Set up auto-renewal: certbot renew
#
# ALTERNATIVE: Cloudflare Tunnel (RECOMMENDED for clinics)
#   → See README-REVERSE-PROXY.md section "Cloudflare Tunnel"
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upload limits
    client_max_body_size 512M;
    client_body_buffer_size 16K;

    # Timeouts
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    proxy_buffering off;
    proxy_request_buffering off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS — forces HTTPS after first visit (enable only after SSL works)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    upstream backend_server {
        server backend:8080;
    }

    # =====================================================================
    # HTTP server — redirects everything to HTTPS
    # =====================================================================
    server {
        listen 80;
        server_name erp.hopehospital.in;   # ← CHANGE THIS to your domain

        # Let's Encrypt challenge (for certificate renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================================
    # HTTPS server — main ERP entry point with SSL
    # =====================================================================
    server {
        listen 443 ssl http2;
        server_name erp.hopehospital.in;   # ← CHANGE THIS to your domain

        # -----------------------------------------------------------------
        # SSL Certificates — update these paths to your actual certificates
        # -----------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern SSL configuration (A+ rating on SSL Labs)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # -----------------------------------------------------------------
        # Proxy to backend
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "nginx-ok\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------------
        # Future PACS routing (Orthanc/Conquest DICOM server)
        # -----------------------------------------------------------------
        # location /pacs/ {
        #     proxy_pass http://pacs-server:8042/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_read_timeout 600s;
        # }

        # -----------------------------------------------------------------
        # Future standalone reports portal
        # -----------------------------------------------------------------
        # location /reports/ {
        #     proxy_pass http://reports-server:3001/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        # }
    }
}
