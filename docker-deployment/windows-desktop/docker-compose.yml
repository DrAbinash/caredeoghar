# =============================================================================
# Care Diagnostics ERP — Windows Desktop Docker Production Deployment
# =============================================================================
#
# Architecture:
#   - PostgreSQL 16 (database, internal port 5432 — not exposed to network)
#   - Backend Node.js (Express API + 3 bundled frontend SPAs, port 8080→8081)
#
# The backend serves EVERYTHING from one process:
#   - REST API             → http://localhost:8081/api/*
#   - Public clinic website  → http://localhost:8081/
#   - Staff ERP            → http://localhost:8081/erp/
#   - Super Admin portal   → http://localhost:8081/super-admin-portal/
#
# Single port = simple firewall rule. No separate frontend container needed
# because the backend already bundles and serves all 3 Vite-built SPAs statically.
#
# MEMORY LIMITS:
#   - Backend:  4GB max (Node.js app + 3 SPAs served statically)
#   - Postgres: 2GB max (database cache + connections)
#   Minimum total host RAM recommended: 6GB free
#
# PERSISTENT DATA (survives container removal / host reboot):
#   - postgres_data      → Docker volume for database files
#   - uploads            → ./uploads/  folder for patient photos, reports, website media
#   - backups            → ./backups/  folder for .sql dumps (visible in File Explorer)
#   - logs               → ./logs/     folder for application logs
#   - dicom-storage      → ./dicom-storage/ folder for future PACS imaging files
#
# UPLOAD SIZE NOTES:
#   - Normal JSON API body:      5 MB (suitable for bills, test orders, settings)
#   - Normal document uploads:   25 MB (reports, patient photos, PDFs)
#   - Future DICOM uploads:      should use streaming/multipart; limit 512 MB+
#   - DICOM files must NEVER be stored inside PostgreSQL — always use file system
#
# HEALTHCHECKS: Both services auto-restart if unhealthy 5 times in a row.
# RESTART POLICY: unless-stopped → auto-restarts after host reboot.
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — persistent database for all ERP data
  # ---------------------------------------------------------------------------
  # Internal only — port 5432 is bound to 127.0.0.1 so only the host can
  # run pg_dump / pg_restore. No network exposure.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: care-diagnostics-db
    restart: unless-stopped
    # Memory limit prevents postgres from consuming all host RAM
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-HospERP}
      # Recommended production settings (Alpine defaults are conservative)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      # Persistent database files — survives container restarts and host reboots
      - postgres_data:/var/lib/postgresql/data
      # Shared backup folder — pg_dump writes here, host can read .sql files
      - ./backups:/backups
      # Initialization scripts (future: custom extensions, seed data)
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only — not accessible from other devices on the LAN
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-HospERP}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - care-diagnostics

  # ---------------------------------------------------------------------------
  # Backend — Express 5 API server with all 3 frontend SPAs bundled
  # ---------------------------------------------------------------------------
  # This single container serves the entire application:
  #   - API endpoints         → http://localhost:8081/api/...
  #   - Public clinic website → http://localhost:8081/
  #   - Staff ERP             → http://localhost:8081/erp/
  #   - Super Admin           → http://localhost:8081/super-admin-portal/
  #
  # Waits for postgres healthcheck before starting (depends_on condition).
  # Migrations run automatically on startup (startup migrations in src/index.ts).
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: docker-deployment/windows-desktop/Dockerfile.backend
    container_name: care-diagnostics-backend
    restart: unless-stopped
    # Memory limit prevents Node.js from consuming all host RAM
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    environment:
      # ── Database ───────────────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME_PASSWORD}@postgres:5432/${DB_NAME:-HospERP}

      # ── Server ──────────────────────────────────────────────────────────────────────────
      PORT: "8080"
      NODE_ENV: production

      # ── Features ──────────────────────────────────────────────────────────────────────────
      # Enable cron schedulers (daily backups, appointment reminders, etc.)
      # REQUIRED for Docker always-on hosts (unlike cloud autoscale)
      ENABLE_SCHEDULERS: "1"

      # Enable DICOM pull agent (if PACS configured via Settings UI later)
      ENABLE_DICOM_PULL_AGENT: "1"

      # Serve the 3 built SPAs from dist/web/
      SERVE_STATIC_DIR: artifacts/api-server/dist/web

      # ── Security ──────────────────────────────────────────────────────────────────────────
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-random-long-string}

      # ── Optional: AI Integration (Gemini) ────────────────────────────────────────────────────────
      # Uncomment and set in .env if using AI-powered clinical notes / billing insights
      # AI_INTEGRATIONS_GEMINI_API_KEY: ${AI_INTEGRATIONS_GEMINI_API_KEY:-}
      # AI_INTEGRATIONS_GEMINI_BASE_URL: ${AI_INTEGRATIONS_GEMINI_BASE_URL:-}

      # ── Optional: Email Notifications ──────────────────────────────────────────────────────────────────────────
      # Uncomment and set in .env if sending appointment reminders / reports by email
      # SMTP_HOST: ${SMTP_HOST:-}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_USER: ${SMTP_USER:-}
      # SMTP_PASS: ${SMTP_PASS:-}

      # ── Optional: Object Storage ─────────────────────────────────────────────────────────────────────────
      # For persistent file uploads (reports, patient photos, DICOM)
      # DEFAULT_OBJECT_STORAGE_BUCKET_ID: ${DEFAULT_OBJECT_STORAGE_BUCKET_ID:-}
      # PRIVATE_OBJECT_DIR: ${PRIVATE_OBJECT_DIR:-}
      # PUBLIC_OBJECT_SEARCH_PATHS: ${PUBLIC_OBJECT_SEARCH_PATHS:-}

      # ── Optional: Super Admin USB Key ────────────────────────────────────────────────────────────────────────
      # Content of superadmin.key file on the USB pen-drive (compliance access)
      # Leave empty to disable the USB gate (not recommended for production)
      # SUPER_ADMIN_USB_KEY: ${SUPER_ADMIN_USB_KEY:-}

      # ── Optional: PACS / DICOM Server ─────────────────────────────────────────────────────────────────────────
      # For integration with Orthanc or Conquest DICOM servers (future)
      # CONQUEST_HOST: ${CONQUEST_HOST:-}
      # CONQUEST_PORT: ${CONQUEST_PORT:-5678}

    ports:
      # Main ERP access port — clinic website, staff ERP, admin, API
      - "8081:8080"
    volumes:
      # Patient photos, reports, website media — persistent across rebuilds
      - ./uploads:/home/runner/workspace/data/uploads
      # Backup dumps — host can read .sql files directly
      - ./backups:/home/runner/workspace/backups
      # Application logs — accessible for troubleshooting
      - ./logs:/home/runner/workspace/logs
      # Future DICOM/PACS storage — large imaging files, NOT in PostgreSQL
      - ./dicom-storage:/home/runner/workspace/dicom-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - care-diagnostics

# =============================================================================
# Persistent volumes (Docker-managed, survive container removal)
# =============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  care-diagnostics:
    driver: bridge
