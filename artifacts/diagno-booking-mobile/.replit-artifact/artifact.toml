kind = "mobile"
previewPath = "/mobile/"
title = "Care Diagnostics Booking"
version = "1.0.0"
id = "artifacts/diagno-booking-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 25532

[services.development]
run = "pnpm --filter @workspace/diagno-booking-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diagno-booking-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/diagno-booking-mobile", "run", "serve" ]

[services.env]
PORT = "25532"
BASE_PATH = "/mobile/"
