kind = "web"
previewPath = "/site/"
title = "Clinic Website"
version = "1.0.0"
id = "artifacts/clinic-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/site/" ]
localPort = 23508

[services.development]
run = "pnpm --filter @workspace/clinic-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinic-site", "run", "build" ]
publicDir = "artifacts/clinic-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23508"
BASE_PATH = "/site/"
